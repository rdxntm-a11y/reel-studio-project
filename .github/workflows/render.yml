name: Render Untold Story Demo

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Render UntoldStoryDemo
        run: npx remotion render src/index.ts UntoldStoryDemo out/UntoldStoryDemo.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: UntoldStoryDemo
          path: out/UntoldStoryDemo.mp4
