name: Render Lead Masks Documentary 16x9

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Render LeadMasksDocumentary
        run: npx remotion render src/index.ts LeadMasksDocumentary out/LeadMasksDocumentary.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: LeadMasksDocumentary
          path: out/LeadMasksDocumentary.mp4
